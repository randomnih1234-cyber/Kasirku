<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Harga & Kasir Sembako</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4 pb-12">

    <div class="max-w-md mx-auto">
        <h1 class="text-xl font-bold text-center text-emerald-700 my-2">🛒 Cek Harga Sembako</h1>

        <!-- AREA KAMERA -->
        <div class="bg-white rounded-xl shadow p-3 mb-4">
            <div class="relative overflow-hidden rounded-lg">
                <div id="reader" class="w-full bg-black min-h-[180px]"></div>
                <div id="successOverlay" class="absolute inset-0 bg-emerald-950/60 backdrop-blur-[2px] flex flex-col items-center justify-center hidden transition-all duration-200 opacity-0 scale-90 pointer-events-none z-20">
                    <div class="bg-emerald-500 text-white p-3 rounded-full shadow-lg ring-4 ring-emerald-300/50">
                        <svg class="w-8 h-8 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                    </div>
                    <span id="successText" class="text-white font-bold mt-2 text-xs text-center px-4">Ter-scan!</span>
                </div>
            </div>

            <div class="mt-2 bg-slate-100 p-2.5 rounded-lg border text-center relative">
                <p class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">Status Kamera / Suara Live:</p>
                <p id="liveTextDisplay" class="text-xs font-mono font-bold text-emerald-800 truncate mt-0.5">Kamera mati.</p>
                <div id="failIndicator" class="hidden mt-1.5 pt-1.5 border-t border-slate-200 flex items-center justify-center gap-1 text-xs font-bold text-rose-600">
                    <span>❌</span>
                    <span id="failText">Tidak Ditemukan</span>
                </div>
            </div>

            <div class="flex items-center gap-2 mt-3 mb-2">
                <button onclick="startScanner()" class="flex-1 bg-emerald-600 text-white py-2 rounded-lg text-xs font-semibold hover:bg-emerald-700">📷 Buka Kamera</button>
                <button id="micBtn" onclick="toggleVoice()" title="Input Suara" class="bg-indigo-600 text-white p-2 rounded-lg text-base hover:bg-indigo-700 transition shrink-0 flex items-center justify-center">🎙️</button>
                <button onclick="stopScanner()" class="flex-1 bg-rose-600 text-white py-2 rounded-lg text-xs font-semibold hover:bg-rose-700">🛑 Stop Kamera</button>
            </div>

            <div class="relative">
                <input type="text" id="manualSearchInput" onkeyup="filterManualSearch()" placeholder="🔍 Cari / ketik nama barang manual..." class="w-full p-2 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50">
                <div id="searchResults" class="absolute left-0 right-0 top-full mt-1 bg-white border rounded-lg shadow-xl max-h-40 overflow-y-auto z-30 hidden"></div>
            </div>
        </div>

        <!-- KERANJANG BELANJA -->
        <div class="bg-white rounded-xl shadow p-4 mb-4 border-2 border-emerald-500">
            <div class="flex justify-between items-center mb-2 pb-2 border-b">
                <h2 class="text-sm font-bold text-slate-800">🛍️ Daftar Belanjaan</h2>
                <button onclick="clearCart()" class="text-xs text-rose-600 font-semibold hover:underline">Kosongkan</button>
            </div>
            <div id="cartList" class="space-y-2 max-h-48 overflow-y-auto mb-3 text-xs">
                <p class="text-center text-slate-400 py-3">Scan camera, sebut nama (mic), atau ketik di pencarian manual.</p>
            </div>
            <div class="bg-emerald-50 p-3 rounded-lg border border-emerald-200 space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-700">Total Harga:</span>
                    <span id="grandTotal" class="text-base font-extrabold text-emerald-700">Rp 0</span>
                </div>
                <hr class="border-emerald-200 border-dashed">
                <div class="grid grid-cols-2 gap-2 items-center text-xs">
                    <div>
                        <label class="block font-medium text-slate-600">Bayar (Rp):</label>
                        <input type="text" id="paidInput" oninput="calculateChange()" placeholder="Contoh: 10 (10rb)" class="w-full mt-1 p-1.5 border rounded font-semibold text-slate-800 outline-none focus:ring-1 focus:ring-emerald-500 bg-white">
                    </div>
                    <div class="text-right">
                        <span class="block text-slate-500 font-medium">Kembali:</span>
                        <span id="changeOutput" class="text-sm font-bold text-slate-800">Rp 0</span>
                    </div>
                </div>
                <div class="flex gap-1 pt-1 overflow-x-auto">
                    <button type="button" onclick="setPaidAmount('exact')" class="px-2 py-1 bg-white border border-emerald-300 rounded text-[10px] font-semibold text-emerald-800 hover:bg-emerald-100 shrink-0">Uang Pas</button>
                    <button type="button" onclick="setPaidAmount(10)" class="px-2 py-1 bg-white border border-emerald-300 rounded text-[10px] font-semibold text-emerald-800 hover:bg-emerald-100 shrink-0">10rb</button>
                    <button type="button" onclick="setPaidAmount(20)" class="px-2 py-1 bg-white border border-emerald-300 rounded text-[10px] font-semibold text-emerald-800 hover:bg-emerald-100 shrink-0">20rb</button>
                    <button type="button" onclick="setPaidAmount(50)" class="px-2 py-1 bg-white border border-emerald-300 rounded text-[10px] font-semibold text-emerald-800 hover:bg-emerald-100 shrink-0">50rb</button>
                </div>
            </div>
        </div>

        <!-- FORM TAMBAH BARANG -->
        <div class="bg-white rounded-xl shadow p-4 mb-4">
            <div class="flex justify-between items-center mb-3">
                <h2 id="formTitle" class="text-sm font-bold text-slate-700">➕ Simpan Harga Barang Baru</h2>
                <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="text-xs text-slate-500 underline hidden">Batal Edit</button>
            </div>
            <form id="productForm" onsubmit="saveProduct(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-600 font-medium">Barcode / Kode Unik (Opsional)</label>
                    <input type="text" id="barcodeInput" placeholder="Kosongkan jika tidak ada barcode" class="w-full mt-1 p-2 border rounded-lg text-xs outline-none focus:ring-1 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-600 font-medium">Nama Barang</label>
                    <input type="text" id="nameInput" required placeholder="Contoh: Indomilk Kids Cokelat" class="w-full mt-1 p-2 border rounded-lg text-xs outline-none focus:ring-1 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-600 font-medium">Harga (4 = 4rb, 10.5 = 10.5rb)</label>
                    <input type="text" id="priceInput" required placeholder="Contoh: 4" class="w-full mt-1 p-2 border rounded-lg text-xs outline-none focus:ring-1 focus:ring-emerald-500">
                </div>
                <button type="submit" id="saveBtn" class="w-full bg-slate-800 text-white py-2 rounded-lg text-xs font-semibold hover:bg-slate-900">💾 Simpan Harga</button>
            </form>
        </div>

        <div class="bg-white rounded-xl shadow p-4">
            <h2 class="text-sm font-bold mb-3 text-slate-700">📦 Etalase Barang Saya</h2>
            <div id="etalaseList" class="space-y-2 max-h-52 overflow-y-auto text-xs"></div>
        </div>
    </div>

    <script>
        let html5QrCode = null, ocrWorker = null, ocrInterval = null, isProcessingOcr = false, editingKey = null;
        let products = JSON.parse(localStorage.getItem('sembako_products')) || {};
        let cart = {}; 

        function processAmount(val) {
            if (!val) return 0;
            let str = val.toString().replace(',', '.').trim();
            let num = parseFloat(str);
            if (isNaN(num)) return 0;
            if (num > 0 && num < 1000) num = num * 1000;
            return Math.round(num);
        }

        function formatRupiah(num) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
        }

        function cleanAndFixText(text) {
            if (!text) return "";
            return text.toUpperCase().replace(/0/g, 'O').replace(/1/g, 'I').replace(/5/g, 'S').replace(/3/g, 'E').replace(/8/g, 'B').replace(/[^A-Z0-9\s]/g, '').trim();
        }

        function triggerVibration() { if ("vibrate" in navigator) navigator.vibrate(200); }

        function getGrandTotal() { return Object.keys(cart).reduce((sum, key) => sum + (cart[key].price * cart[key].qty), 0); }

        function calculateChange() {
            const total = getGrandTotal();
            const paid = processAmount(document.getElementById('paidInput').value);
            const changeOutput = document.getElementById('changeOutput');
            const change = paid - total;
            if (paid === 0) { changeOutput.innerText = "Rp 0"; changeOutput.className = "text-sm font-bold text-slate-800"; }
            else {
                changeOutput.innerText = change >= 0 ? formatRupiah(change) : "Kurang " + formatRupiah(Math.abs(change));
                changeOutput.className = change >= 0 ? "text-sm font-bold text-emerald-600" : "text-sm font-bold text-rose-600";
            }
        }

        function setPaidAmount(val) {
            if (val === 'exact') document.getElementById('paidInput').value = getGrandTotal();
            else document.getElementById('paidInput').value = val * 1000;
            calculateChange();
        }

        function showScanFeedback(isSuccess, text) {
            if (isSuccess) {
                const overlay = document.getElementById('successOverlay');
                document.getElementById('successText').innerText = text;
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0', 'scale-90'), 10);
                setTimeout(() => { overlay.classList.add('opacity-0', 'scale-90'); setTimeout(() => overlay.classList.add('hidden'), 200); }, 800);
                document.getElementById('failIndicator').classList.add('hidden');
            } else {
                const failIndicator = document.getElementById('failIndicator');
                document.getElementById('failText').innerText = text;
                failIndicator.classList.remove('hidden');
                setTimeout(() => failIndicator.classList.add('hidden'), 1800);
            }
        }

        function filterManualSearch() {
            const query = cleanAndFixText(document.getElementById('manualSearchInput').value);
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '';
            if (query.length === 0) { resultsDiv.classList.add('hidden'); return; }

            let matches = 0;
            for (let key in products) {
                const item = products[key];
                if (cleanAndFixText(key + " " + item.name).includes(query)) {
                    matches++;
                    const row = document.createElement('div');
                    row.className = "p-2.5 hover:bg-emerald-50 cursor-pointer border-b text-xs flex justify-between";
                    row.innerHTML = `<span>${item.name}</span><span class="font-bold text-emerald-700">${formatRupiah(item.price)}</span>`;
                    row.onclick = () => { addToCart(key); showScanFeedback(true, item.name); document.getElementById('manualSearchInput').value = ''; resultsDiv.classList.add('hidden'); };
                    resultsDiv.appendChild(row);
                }
            }
            resultsDiv.classList.toggle('hidden', matches === 0);
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'id-ID';
            recognition.onresult = (e) => matchAndAddToCart(e.results[0][0].transcript, true);
        }

        function toggleVoice() { recognition ? recognition.start() : alert("Browser tidak support."); }

        function matchAndAddToCart(inputText, isExplicit) {
            const cleanInput = cleanAndFixText(inputText);
            let matchedKeys = [];
            for (let key in products) {
                if (cleanAndFixText(key + " " + products[key].name).includes(cleanInput)) matchedKeys.push(key);
            }
            if (matchedKeys.length === 1) { addToCart(matchedKeys[0]); showScanFeedback(true, products[matchedKeys[0]].name); }
            else if (matchedKeys.length > 1) { document.getElementById('manualSearchInput').value = inputText; filterManualSearch(); }
            else if (isExplicit) showScanFeedback(false, "Barang tidak ditemukan");
        }

        async function startScanner() {
            if (html5QrCode && html5QrCode.isScanning) return;
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 220, height: 140 } }, (code) => handleDetectedKey(code), () => {});
            ocrInterval = setInterval(processLiveFrameOCR, 1500);
        }

        function stopScanner() { if (html5QrCode && html5QrCode.isScanning) html5QrCode.stop().then(() => { document.getElementById("reader").innerHTML = ""; clearInterval(ocrInterval); }); }

        async function processLiveFrameOCR() {
            if (!ocrWorker) ocrWorker = await Tesseract.createWorker('ind');
            const video = document.querySelector("#reader video");
            if (!video) return;
            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext("2d").drawImage(video, 0, 0);
            const { data } = await ocrWorker.recognize(canvas);
            matchAndAddToCart(cleanAndFixText(data.text), false);
        }

        function handleDetectedKey(key) {
            if (products[key]) { addToCart(key); showScanFeedback(true, products[key].name); }
        }

        function addToCart(key) {
            if (cart[key]) cart[key].qty += 1;
            else cart[key] = { name: products[key].name, price: products[key].price, qty: 1 };
            renderCart();
        }

        function updateQty(key, change) { cart[key].qty += change; if (cart[key].qty <= 0) delete cart[key]; renderCart(); }
        function removeFromCart(key) { delete cart[key]; renderCart(); }
        function clearCart() { cart = {}; document.getElementById('paidInput').value = ''; renderCart(); }

        function renderCart() {
            const cartList = document.getElementById('cartList');
            cartList.innerHTML = Object.keys(cart).map(k => `
                <div class="flex justify-between items-center p-2 bg-slate-50 rounded border">
                    <div class="flex-1 pr-2"><p class="font-bold">${cart[k].name}</p><p class="text-[10px] text-slate-500">${formatRupiah(cart[k].price)} x ${cart[k].qty}</p></div>
                    <div class="flex items-center gap-1">
                        <button onclick="updateQty('${k}', -1)" class="w-6 h-6 bg-slate-200 rounded">-</button>
                        <span class="w-6 text-center font-bold">${cart[k].qty}</span>
                        <button onclick="updateQty('${k}', 1)" class="w-6 h-6 bg-slate-200 rounded">+</button>
                        <button onclick="removeFromCart('${k}')" class="ml-1 text-rose-500">❌</button>
                    </div>
                </div>
            `).join('');
            document.getElementById('grandTotal').innerText = formatRupiah(getGrandTotal());
            calculateChange();
        }

        function saveProduct(e) {
            e.preventDefault();
            let key = document.getElementById('barcodeInput').value.trim().toUpperCase();
            if (!key) key = "MANUAL_" + Date.now();
            products[key] = { name: document.getElementById('nameInput').value, price: processAmount(document.getElementById('priceInput').value) };
            localStorage.setItem('sembako_products', JSON.stringify(products));
            cancelEdit(); renderEtalase();
        }

        function editProduct(key) { editingKey = key; document.getElementById('barcodeInput').value = key; document.getElementById('nameInput').value = products[key].name; document.getElementById('priceInput').value = products[key].price; document.getElementById('formTitle').innerText = "✏️ Edit Barang"; document.getElementById('cancelEditBtn').classList.remove('hidden'); }
        function cancelEdit() { editingKey = null; document.getElementById('productForm').reset(); document.getElementById('formTitle').innerText = "➕ Simpan Harga Barang Baru"; document.getElementById('cancelEditBtn').classList.add('hidden'); }
        function deleteProduct(key) { delete products[key]; localStorage.setItem('sembako_products', JSON.stringify(products)); renderEtalase(); }
        function renderEtalase() {
            document.getElementById('etalaseList').innerHTML = Object.keys(products).map(k => `
                <div class="flex justify-between items-center p-2 bg-slate-50 border rounded">
                    <div><p class="font-bold">${products[k].name}</p><p class="text-[10px]">Kode: ${k}</p></div>
                    <div class="flex gap-1"><button onclick="editProduct('${k}')" class="bg-amber-100 p-1 rounded">✏️</button><button onclick="deleteProduct('${k}')" class="bg-rose-100 p-1 rounded">🗑️</button></div>
                </div>
            `).join('');
        }

        renderEtalase();
    </script>
</body>
</html>
