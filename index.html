<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Harga & Kasir Sembako</title>
    <!-- Library Barcode Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Library Pembaca Teks (OCR) -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <!-- Styling Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4 pb-12">

    <div class="max-w-md mx-auto">
        <!-- Header -->
        <h1 class="text-xl font-bold text-center text-emerald-700 my-2">🛒 Cek Harga Sembako</h1>

        <!-- AREA KAMERA & TOMBOL KONTROL -->
        <div class="bg-white rounded-xl shadow p-3 mb-4">
            <div class="relative overflow-hidden rounded-lg">
                <!-- Frame Kamera -->
                <div id="reader" class="w-full bg-black min-h-[180px]"></div>

                <!-- OVERLAY CENTANG HIJAU (HANYA MUNCUL SAAT SUKSES) -->
                <div id="successOverlay" class="absolute inset-0 bg-emerald-950/60 backdrop-blur-[2px] flex flex-col items-center justify-center hidden transition-all duration-200 opacity-0 scale-90 pointer-events-none z-20">
                    <div class="bg-emerald-500 text-white p-3 rounded-full shadow-lg ring-4 ring-emerald-300/50">
                        <svg class="w-8 h-8 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                    </div>
                    <span id="successText" class="text-white font-bold mt-2 text-xs text-center px-4">Ter-scan!</span>
                </div>
            </div>

            <!-- INDIKATOR TEKS REAL-TIME & NOTIFIKASI GAGAL DI BAWAH KAMERA -->
            <div class="mt-2 bg-slate-100 p-2.5 rounded-lg border text-center relative">
                <p class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">Status Kamera / Suara Live:</p>
                <p id="liveTextDisplay" class="text-xs font-mono font-bold text-emerald-800 truncate mt-0.5">Kamera mati.</p>
                
                <!-- INDIKATOR GAGAL (KECIL DI BAWAH STATUS) -->
                <div id="failIndicator" class="hidden mt-1.5 pt-1.5 border-t border-slate-200 flex items-center justify-center gap-1 text-xs font-bold text-rose-600">
                    <span>❌</span>
                    <span id="failText">Tidak Ditemukan di Etalase</span>
                </div>
            </div>

            <!-- TOMBOL KONTROL -->
            <div class="flex items-center gap-2 mt-3 mb-2">
                <button onclick="startScanner()" class="flex-1 bg-emerald-600 text-white py-2 rounded-lg text-xs font-semibold hover:bg-emerald-700">
                    📷 Buka Kamera
                </button>
                
                <!-- TOMBOL MIC MINIMALIS -->
                <button id="micBtn" onclick="toggleVoice()" title="Input Suara" class="bg-indigo-600 text-white p-2 rounded-lg text-base hover:bg-indigo-700 transition shrink-0 flex items-center justify-center">
                    🎙️
                </button>

                <button onclick="stopScanner()" class="flex-1 bg-rose-600 text-white py-2 rounded-lg text-xs font-semibold hover:bg-rose-700">
                    🛑 Stop Kamera
                </button>
            </div>

            <!-- FITUR CARI MANUAL (KETIK) -->
            <div class="relative">
                <input type="text" id="manualSearchInput" onkeyup="filterManualSearch()" placeholder="🔍 Cari / ketik nama barang manual..." class="w-full p-2 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50">
                <!-- DROPDOWN REKOMENDASI HASIL PENCARIAN -->
                <div id="searchResults" class="absolute left-0 right-0 top-full mt-1 bg-white border rounded-lg shadow-xl max-h-40 overflow-y-auto z-30 hidden"></div>
            </div>
        </div>

        <!-- KERANJANG BELANJA & KALKULATOR KEMBALIAN -->
        <div class="bg-white rounded-xl shadow p-4 mb-4 border-2 border-emerald-500">
            <div class="flex justify-between items-center mb-2 pb-2 border-b">
                <h2 class="text-sm font-bold text-slate-800">🛍️ Daftar Belanjaan</h2>
                <button onclick="clearCart()" class="text-xs text-rose-600 font-semibold hover:underline">Kosongkan</button>
            </div>

            <div id="cartList" class="space-y-2 max-h-48 overflow-y-auto mb-3 text-xs">
                <p class="text-center text-slate-400 py-3">Scan camera, sebut nama (mic), atau ketik di pencarian manual.</p>
            </div>

            <!-- RINGKASAN TOTAL & KALKULATOR KEMBALIAN -->
            <div class="bg-emerald-50 p-3 rounded-lg border border-emerald-200 space-y-2">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-700">Total Harga:</span>
                    <span id="grandTotal" class="text-base font-extrabold text-emerald-700">Rp 0</span>
                </div>

                <hr class="border-emerald-200 border-dashed">

                <div class="grid grid-cols-2 gap-2 items-center text-xs">
                    <div>
                        <label class="block font-medium text-slate-600">Uang Dibayar (Rp):</label>
                        <input type="text" id="paidInput" oninput="calculateChange()" placeholder="Contoh: 10 (10rb)" class="w-full mt-1 p-1.5 border rounded font-semibold text-slate-800 outline-none focus:ring-1 focus:ring-emerald-500 bg-white">
                    </div>
                    <div class="text-right">
                        <span class="block text-slate-500 font-medium">Kembalian:</span>
                        <span id="changeOutput" class="text-sm font-bold text-slate-800">Rp 0</span>
                    </div>
                </div>

                <!-- TOMBOL CEPAT PECAHAN UANG -->
                <div class="flex gap-1 pt-1 overflow-x-auto">
                    <button type="button" onclick="setPaidAmount('exact')" class="px-2 py-1 bg-white border border-emerald-300 rounded text-[10px] font-semibold text-emerald-800 hover:bg-emerald-100 shrink-0">Uang Pas</button>
                    <button type="button" onclick="setPaidAmount(10)" class="px-2 py-1 bg-white border border-emerald-300 rounded text-[10px] font-semibold text-emerald-800 hover:bg-emerald-100 shrink-0">10rb</button>
                    <button type="button" onclick="setPaidAmount(20)" class="px-2 py-1 bg-white border border-emerald-300 rounded text-[10px] font-semibold text-emerald-800 hover:bg-emerald-100 shrink-0">20rb</button>
                    <button type="button" onclick="setPaidAmount(50)" class="px-2 py-1 bg-white border border-emerald-300 rounded text-[10px] font-semibold text-emerald-800 hover:bg-emerald-100 shrink-0">50rb</button>
                    <button type="button" onclick="setPaidAmount(100)" class="px-2 py-1 bg-white border border-emerald-300 rounded text-[10px] font-semibold text-emerald-800 hover:bg-emerald-100 shrink-0">100rb</button>
                </div>
            </div>
        </div>

        <!-- FORM TAMBAH / EDIT BARANG -->
        <div class="bg-white rounded-xl shadow p-4 mb-4">
            <div class="flex justify-between items-center mb-3">
                <h2 id="formTitle" class="text-sm font-bold text-slate-700">➕ Simpan Harga Barang Baru</h2>
                <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="text-xs text-slate-500 underline hidden">Batal Edit</button>
            </div>

            <form id="productForm" onsubmit="saveProduct(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-600 font-medium">Barcode / Kode Unik</label>
                    <input type="text" id="barcodeInput" required placeholder="Contoh: 8991234 atau INDOMILK" class="w-full mt-1 p-2 border rounded-lg text-xs outline-none focus:ring-1 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-600 font-medium">Nama Barang</label>
                    <input type="text" id="nameInput" required placeholder="Contoh: Indomilk Kids Cokelat" class="w-full mt-1 p-2 border rounded-lg text-xs outline-none focus:ring-1 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-600 font-medium">Harga (Tulis: 4 = 4.000, 10.5 = 10.500)</label>
                    <input type="text" id="priceInput" required placeholder="Contoh: 4 atau 10.5" class="w-full mt-1 p-2 border rounded-lg text-xs outline-none focus:ring-1 focus:ring-emerald-500">
                </div>
                <button type="submit" id="saveBtn" class="w-full bg-slate-800 text-white py-2 rounded-lg text-xs font-semibold hover:bg-slate-900">
                    💾 Simpan Harga
                </button>
            </form>
        </div>

        <!-- DAFTAR ETALASE BARANG -->
        <div class="bg-white rounded-xl shadow p-4">
            <h2 class="text-sm font-bold mb-3 text-slate-700">📦 Etalase Barang Saya</h2>
            <div id="etalaseList" class="space-y-2 max-h-52 overflow-y-auto text-xs">
                <!-- Daftar barang terdaftar -->
            </div>
        </div>
    </div>

    <script>
        let html5QrCode = null;
        let ocrWorker = null;
        let ocrInterval = null;
        let isProcessingOcr = false;
        let editingKey = null;

        // Data barang tersimpan di HP
        let products = JSON.parse(localStorage.getItem('sembako_products')) || {
            "INDOMILK1": { name: "Indomilk Kids Cokelat", price: 4000 },
            "INDOMILK2": { name: "Indomilk Sachet Renteng", price: 15000 },
            "INDOMIE": { name: "Indomie Goreng", price: 3500 }
        };
        let cart = {}; 
        let lastScannedKey = null;
        let lastScanTime = 0;
        let lastFailTime = 0;
        let failTimer = null;

        // --- FUNGSI PINTAR: UBAH SINGKATAN KE RIBUAN ---
        // Contoh: 2 -> 2000, 10 -> 10000, 10.5 atau 10,5 -> 10500
        function processAmount(val) {
            if (!val) return 0;
            let str = val.toString().replace(',', '.').trim();
            let num = parseFloat(str);
            if (isNaN(num)) return 0;
            
            // Jika nilai angka di bawah 1000, otomatis dikali 1000
            if (num > 0 && num < 1000) {
                num = num * 1000;
            }
            return Math.round(num);
        }

        function formatRupiah(num) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
        }

        function cleanAndFixText(text) {
            if (!text) return "";
            return text.toUpperCase()
                .replace(/[\r\n]+/g, ' ')
                .replace(/0/g, 'O')
                .replace(/1/g, 'I')
                .replace(/5/g, 'S')
                .replace(/3/g, 'E')
                .replace(/8/g, 'B')
                .replace(/[^A-Z0-9\s]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function triggerVibration() {
            if ("vibrate" in navigator) navigator.vibrate(200);
        }

        // --- HITUNG KEMBALIAN PINTAR ---
        function getGrandTotal() {
            return Object.keys(cart).reduce((sum, key) => sum + (cart[key].price * cart[key].qty), 0);
        }

        function calculateChange() {
            const total = getGrandTotal();
            const paidRaw = document.getElementById('paidInput').value;
            const paid = processAmount(paidRaw);
            const changeOutput = document.getElementById('changeOutput');

            if (paid === 0 || paidRaw === "") {
                changeOutput.className = "text-sm font-bold text-slate-800";
                changeOutput.innerText = "Rp 0";
                return;
            }

            const change = paid - total;
            if (change >= 0) {
                changeOutput.className = "text-sm font-bold text-emerald-600";
                changeOutput.innerText = formatRupiah(change);
            } else {
                changeOutput.className = "text-sm font-bold text-rose-600";
                changeOutput.innerText = "Kurang " + formatRupiah(Math.abs(change));
            }
        }

        function setPaidAmount(val) {
            const total = getGrandTotal();
            if (val === 'exact') {
                document.getElementById('paidInput').value = total;
            } else {
                document.getElementById('paidInput').value = val; // Otomatis diproses oleh processAmount
            }
            calculateChange();
        }

        // --- SISTEM PEMERITAHUAN (CENTANG HIJAU / TANDA X BAWAH) ---
        function showScanFeedback(isSuccess, text) {
            if (isSuccess) {
                const overlay = document.getElementById('successOverlay');
                document.getElementById('successText').innerText = text;

                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0', 'scale-90'), 10);

                setTimeout(() => {
                    overlay.classList.add('opacity-0', 'scale-90');
                    setTimeout(() => overlay.classList.add('hidden'), 200);
                }, 800);

                document.getElementById('failIndicator').classList.add('hidden');

            } else {
                const failIndicator = document.getElementById('failIndicator');
                document.getElementById('failText').innerText = text;

                failIndicator.classList.remove('hidden');

                if (failTimer) clearTimeout(failTimer);
                failTimer = setTimeout(() => {
                    failIndicator.classList.add('hidden');
                }, 1800);
            }
        }

        // --- FITUR PENCARIAN MANUAL (KETIK) ---
        function filterManualSearch() {
            const rawQuery = document.getElementById('manualSearchInput').value;
            const query = cleanAndFixText(rawQuery);
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '';

            if (query.length === 0) {
                resultsDiv.classList.add('hidden');
                return;
            }

            let matches = 0;
            for (let key in products) {
                const item = products[key];
                const fullText = cleanAndFixText(key + " " + item.name);

                if (fullText.includes(query) || query.split(/\s+/).some(q => q.length >= 3 && fullText.includes(q))) {
                    matches++;
                    const row = document.createElement('div');
                    row.className = "p-2.5 hover:bg-emerald-50 cursor-pointer border-b last:border-b-0 flex justify-between items-center text-xs transition";
                    row.innerHTML = `
                        <div>
                            <p class="font-bold text-slate-800">${item.name}</p>
                            <p class="text-[10px] text-slate-400">Kode: ${key}</p>
                        </div>
                        <span class="font-bold text-emerald-700">${formatRupiah(item.price)}</span>
                    `;
                    row.onclick = () => {
                        addToCart(key);
                        showScanFeedback(true, item.name);
                        triggerVibration();
                        document.getElementById('manualSearchInput').value = '';
                        resultsDiv.classList.add('hidden');
                    };
                    resultsDiv.appendChild(row);
                }
            }

            if (matches > 0) {
                resultsDiv.classList.remove('hidden');
            } else {
                resultsDiv.innerHTML = `<div class="p-3 text-center text-slate-400 text-xs">Barang tidak ditemukan di etalase</div>`;
                resultsDiv.classList.remove('hidden');
            }
        }

        // --- FITUR PERINTAH SUARA ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'id-ID';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                const micBtn = document.getElementById('micBtn');
                micBtn.className = "bg-rose-600 text-white p-2 rounded-lg text-base animate-pulse transition shrink-0 flex items-center justify-center";
                document.getElementById('liveTextDisplay').innerText = "🎙️ Mendengarkan suara...";
            };

            recognition.onresult = (event) => {
                const spokenText = event.results[0][0].transcript;
                document.getElementById('liveTextDisplay').innerText = `Suara: "${spokenText}"`;
                matchAndAddToCart(spokenText, true);
            };

            recognition.onerror = () => {
                document.getElementById('liveTextDisplay').innerText = "⚠️ Suara tidak terdeteksi.";
                showScanFeedback(false, "Suara Tidak Terdeteksi");
            };

            recognition.onend = () => {
                isListening = false;
                const micBtn = document.getElementById('micBtn');
                micBtn.className = "bg-indigo-600 text-white p-2 rounded-lg text-base hover:bg-indigo-700 transition shrink-0 flex items-center justify-center";
            };
        }

        function toggleVoice() {
            if (!SpeechRecognition) {
                alert("Browser HP Anda belum mendukung perintah suara. Gunakan Google Chrome!");
                return;
            }
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        // --- LOGIKA PENCOCOKAN BARANG ---
        function matchAndAddToCart(inputText, isExplicitAction = false) {
            const cleanInput = cleanAndFixText(inputText);
            if (cleanInput.length < 2) return;

            let matchedKeys = [];

            for (let key in products) {
                const item = products[key];
                const fullTargetText = cleanAndFixText(key + " " + item.name);

                const inputWords = cleanInput.split(/\s+/).filter(w => w.length >= 3);
                const targetWords = fullTargetText.split(/\s+/).filter(w => w.length >= 3);

                let isMatch = false;

                if (cleanInput.includes(fullTargetText) || fullTargetText.includes(cleanInput)) {
                    isMatch = true;
                } else {
                    for (let inW of inputWords) {
                        for (let tarW of targetWords) {
                            if (tarW.includes(inW) || inW.includes(tarW)) {
                                isMatch = true;
                                break;
                            }
                        }
                        if (isMatch) break;
                    }
                }

                if (isMatch) {
                    matchedKeys.push(key);
                }
            }

            if (matchedKeys.length === 1) {
                const key = matchedKeys[0];
                showScanFeedback(true, products[key].name);
                triggerVibration();
                addToCart(key);
            } 
            else if (matchedKeys.length > 1) {
                const searchInput = document.getElementById('manualSearchInput');
                searchInput.value = inputText.trim();
                filterManualSearch();

                document.getElementById('liveTextDisplay').innerText = `⚠️ Ditemukan ${matchedKeys.length} varian "${inputText}". Pilih di bawah!`;
                triggerVibration();
            } 
            else if (isExplicitAction) {
                showScanFeedback(false, `Barang "${inputText}" Tidak Ditemukan`);
            } else {
                const now = Date.now();
                if (now - lastFailTime > 2500) {
                    lastFailTime = now;
                    showScanFeedback(false, "Tidak Ditemukan di Etalase");
                }
            }
        }

        // MULAI KAMERA LIVE
        async function startScanner() {
            if (html5QrCode && html5QrCode.isScanning) return;

            document.getElementById('liveTextDisplay').innerText = "Menyiapkan kamera & sistem OCR...";

            if (!ocrWorker) {
                try { ocrWorker = await Tesseract.createWorker('ind'); } catch(e) {}
            }

            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 220, height: 140 } },
                (barcode) => handleDetectedKey(barcode),
                () => {}
            ).then(() => {
                document.getElementById('liveTextDisplay').innerText = "Arahkan kamera ke tulisan merk...";
                ocrInterval = setInterval(processLiveFrameOCR, 1500);
            }).catch(err => {
                document.getElementById('liveTextDisplay').innerText = "Gagal membuka kamera.";
                alert("Gagal membuka kamera: " + err);
            });
        }

        function stopScanner() {
            if (ocrInterval) clearInterval(ocrInterval);
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById("reader").innerHTML = "";
                    document.getElementById('liveTextDisplay').innerText = "Kamera mati.";
                    document.getElementById('failIndicator').classList.add('hidden');
                });
            }
        }

        // PEMBACA TEKS MERK LIVE
        async function processLiveFrameOCR() {
            if (isProcessingOcr || !ocrWorker) return;
            const videoElement = document.querySelector("#reader video");
            if (!videoElement || videoElement.readyState !== 4) return;

            isProcessingOcr = true;
            try {
                const canvas = document.createElement("canvas");
                canvas.width = videoElement.videoWidth / 2;
                canvas.height = videoElement.videoHeight / 2;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

                const result = await ocrWorker.recognize(canvas);
                const cleanOcr = cleanAndFixText(result.data.text);

                const displayBox = document.getElementById('liveTextDisplay');
                if (cleanOcr.length > 0) {
                    displayBox.innerText = cleanOcr.substring(0, 35);
                    matchAndAddToCart(cleanOcr, false);
                } else {
                    displayBox.innerText = "(Mencari tulisan...)";
                }
            } catch (e) {
                console.error("OCR Error:", e);
            } finally {
                isProcessingOcr = false;
            }
        }

        function handleDetectedKey(key) {
            const now = Date.now();
            if (key === lastScannedKey && (now - lastScanTime) < 2000) return;

            lastScannedKey = key;
            lastScanTime = now;

            if (products[key]) {
                showScanFeedback(true, products[key].name);
                triggerVibration();
                addToCart(key);
            } else {
                showScanFeedback(false, "Barcode Tidak Ditemukan");
            }
        }

        // KERANJANG BELANJA
        function addToCart(key) {
            if (!products[key]) return;
            if (cart[key]) {
                cart[key].qty += 1;
            } else {
                cart[key] = { name: products[key].name, price: products[key].price, qty: 1 };
            }
            renderCart();
        }

        function updateQty(key, change) {
            if (cart[key]) {
                cart[key].qty += change;
                if (cart[key].qty <= 0) {
                    delete cart[key];
                }
                renderCart();
            }
        }

        function removeFromCart(key) {
            delete cart[key];
            renderCart();
        }

        function clearCart() {
            cart = {};
            document.getElementById('paidInput').value = '';
            renderCart();
        }

        function renderCart() {
            const cartList = document.getElementById('cartList');
            const keys = Object.keys(cart);
            cartList.innerHTML = '';

            let grandTotal = getGrandTotal();
            if (keys.length === 0) {
                cartList.innerHTML = `<p class="text-center text-slate-400 py-3">Scan camera, sebut nama (mic), atau ketik di pencarian manual.</p>`;
            } else {
                keys.forEach(key => {
                    const item = cart[key];
                    const subtotal = item.price * item.qty;
                    cartList.innerHTML += `
                        <div class="flex justify-between items-center p-2 bg-slate-50 rounded border">
                            <div class="flex-1 pr-2">
                                <p class="font-bold text-slate-800">${item.name}</p>
                                <p class="text-[11px] text-slate-500">${formatRupiah(item.price)} x ${item.qty} = <span class="font-semibold text-emerald-700">${formatRupiah(subtotal)}</span></p>
                            </div>
                            <div class="flex items-center gap-1 shrink-0">
                                <button onclick="updateQty('${key}', -1)" class="w-6 h-6 bg-slate-200 text-slate-700 font-bold rounded text-xs hover:bg-slate-300">-</button>
                                <span class="w-6 text-center font-bold text-xs">${item.qty}</span>
                                <button onclick="updateQty('${key}', 1)" class="w-6 h-6 bg-slate-200 text-slate-700 font-bold rounded text-xs hover:bg-slate-300">+</button>
                                <button onclick="removeFromCart('${key}')" title="Hapus Barang" class="ml-1 text-rose-500 hover:text-rose-700 font-bold text-xs p-1">❌</button>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('grandTotal').innerText = formatRupiah(grandTotal);
            calculateChange();
        }

        // SIMPAN / UPDATE BARANG MASTER (DENGAN CONVERT HARGA PINTAR)
        function saveProduct(e) {
            e.preventDefault();
            const key = document.getElementById('barcodeInput').value.trim().toUpperCase();
            const name = document.getElementById('nameInput').value.trim();
            const rawPrice = document.getElementById('priceInput').value;
            const price = processAmount(rawPrice); // Mengubah 4 -> 4000, 10.5 -> 10500

            if (!key || !name || price === 0) {
                alert("Mohon isi kode, nama, dan harga barang dengan benar.");
                return;
            }

            if (editingKey && editingKey !== key) {
                delete products[editingKey];
            }

            products[key] = { name: name, price: price };
            localStorage.setItem('sembako_products', JSON.stringify(products));

            cancelEdit();
            renderEtalase();
            alert(`Berhasil menyimpan ${name} dengan harga ${formatRupiah(price)}!`);
        }

        // EDIT BARANG
        function editProduct(key) {
            editingKey = key;
            const item = products[key];

            document.getElementById('barcodeInput').value = key;
            document.getElementById('nameInput').value = item.name;
            document.getElementById('priceInput').value = item.price;

            document.getElementById('formTitle').innerText = "✏️ Edit Barang Etalase";
            document.getElementById('saveBtn').innerText = "💾 Simpan Perubahan";
            document.getElementById('cancelEditBtn').classList.remove('hidden');

            document.getElementById('productForm').scrollIntoView({ behavior: 'smooth' });
        }

        // BATAL EDIT
        function cancelEdit() {
            editingKey = null;
            document.getElementById('productForm').reset();
            document.getElementById('formTitle').innerText = "➕ Simpan Harga Barang Baru";
            document.getElementById('saveBtn').innerText = "💾 Simpan Harga";
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        // HAPUS BARANG DARI ETALASE
        function deleteProduct(key) {
            if (confirm(`Hapus "${products[key].name}" dari etalase?`)) {
                delete products[key];
                localStorage.setItem('sembako_products', JSON.stringify(products));
                renderEtalase();
            }
        }

        // TAMPILKAN ETALASE
        function renderEtalase() {
            const listDiv = document.getElementById('etalaseList');
            const keys = Object.keys(products);
            listDiv.innerHTML = '';

            if (keys.length === 0) {
                listDiv.innerHTML = `<p class="text-center text-slate-400 py-3">Belum ada barang di etalase.</p>`;
                return;
            }

            keys.forEach(key => {
                const item = products[key];
                listDiv.innerHTML += `
                    <div class="flex justify-between items-center p-2.5 bg-slate-50 border rounded-lg">
                        <div class="overflow-hidden mr-2">
                            <p class="font-bold text-slate-800 truncate">${item.name}</p>
                            <p class="text-[10px] text-slate-400 font-mono">Kode: ${key} | <span class="font-semibold text-emerald-700">${formatRupiah(item.price)}</span></p>
                        </div>
                        <div class="flex gap-1 shrink-0">
                            <button onclick="editProduct('${key}')" class="px-2 py-1 bg-amber-100 text-amber-800 rounded font-semibold text-[10px] hover:bg-amber-200">✏️ Edit</button>
                            <button onclick="deleteProduct('${key}')" class="px-2 py-1 bg-rose-100 text-rose-700 rounded font-semibold text-[10px] hover:bg-rose-200">🗑️ Hapus</button>
                        </div>
                    </div>
                `;
            });
        }

        // Init awal
        renderCart();
        renderEtalase();
    </script>
</body>
</html>
