<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Sembako Pintar - Online Google Sheets</title>
    <!-- Library CDN -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4 pb-12">

    <div class="max-w-md mx-auto">
        <h1 class="text-xl font-bold text-center text-emerald-700 my-2">🛒 Kasir Sembako</h1>

        <!-- AREA KAMERA -->
        <div class="bg-white rounded-xl shadow p-3 mb-4">
            <div class="relative overflow-hidden rounded-lg">
                <div id="reader" class="w-full bg-black min-h-[180px]"></div>
                <!-- Overlay Sukses -->
                <div id="successOverlay" class="absolute inset-0 bg-emerald-950/60 backdrop-blur-[2px] flex flex-col items-center justify-center hidden z-20 transition-all duration-200 opacity-0 scale-90">
                    <div class="bg-emerald-500 text-white p-3 rounded-full shadow-lg">
                        <svg class="w-8 h-8 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
                    </div>
                    <span id="successText" class="text-white font-bold mt-2 text-xs">Ter-scan!</span>
                </div>
            </div>

            <!-- Status & Notifikasi -->
            <div class="mt-2 bg-slate-100 p-2.5 rounded-lg border text-center">
                <p id="liveTextDisplay" class="text-xs font-bold text-slate-600">Memuat sistem...</p>
                <div id="failIndicator" class="hidden mt-1.5 pt-1.5 border-t border-slate-200 text-xs font-bold text-rose-600">❌ Tidak Ditemukan</div>
            </div>

            <div class="flex items-center gap-2 mt-3">
                <button onclick="startScanner()" class="flex-1 bg-emerald-600 text-white py-2 rounded-lg text-xs font-semibold hover:bg-emerald-700">📷 Kamera</button>
                <button id="micBtn" onclick="toggleVoice()" class="bg-indigo-600 text-white p-2 rounded-lg text-base hover:bg-indigo-700">🎙️</button>
                <button onclick="stopScanner()" class="flex-1 bg-rose-600 text-white py-2 rounded-lg text-xs font-semibold hover:bg-rose-700">🛑 Stop</button>
            </div>
            
            <input type="text" id="manualSearchInput" onkeyup="filterManualSearch()" placeholder="🔍 Cari / ketik nama barang..." class="w-full mt-2 p-2 border rounded-lg text-xs bg-slate-50 outline-emerald-500">
            <div id="searchResults" class="absolute left-4 right-4 mt-1 bg-white border rounded shadow-xl max-h-40 overflow-y-auto z-30 hidden"></div>
        </div>

        <!-- DAFTAR BELANJA -->
        <div class="bg-white rounded-xl shadow p-4 mb-4 border-2 border-emerald-500">
            <div class="flex justify-between items-center mb-2 border-b pb-2">
                <h2 class="text-sm font-bold">🛍️ Daftar Belanjaan</h2>
                <button onclick="clearCart()" class="text-xs text-rose-600 underline">Kosongkan</button>
            </div>
            <div id="cartList" class="space-y-2 max-h-48 overflow-y-auto mb-3 text-xs"></div>
            <div class="bg-emerald-50 p-3 rounded-lg border border-dashed border-emerald-200">
                <div class="flex justify-between font-bold text-emerald-800"><span>Total:</span><span id="grandTotal">Rp 0</span></div>
                <div class="grid grid-cols-2 gap-2 mt-2 text-xs">
                    <div><label>Bayar:</label><input type="text" id="paidInput" oninput="calculateChange()" class="w-full border p-1 rounded bg-white"></div>
                    <div class="text-right"><label>Kembali:</label><div id="changeOutput" class="font-bold">Rp 0</div></div>
                </div>
                <div class="flex gap-1 mt-2 overflow-x-auto">
                    <button onclick="setPaidAmount('exact')" class="px-2 py-1 bg-white border rounded text-[10px] hover:bg-slate-50">Uang Pas</button>
                    <button onclick="setPaidAmount(10)" class="px-2 py-1 bg-white border rounded text-[10px] hover:bg-slate-50">10rb</button>
                    <button onclick="setPaidAmount(20)" class="px-2 py-1 bg-white border rounded text-[10px] hover:bg-slate-50">20rb</button>
                    <button onclick="setPaidAmount(50)" class="px-2 py-1 bg-white border rounded text-[10px] hover:bg-slate-50">50rb</button>
                </div>
            </div>
        </div>

        <!-- FORM TAMBAH / TAUTKAN BARANG -->
        <div class="bg-white rounded-xl shadow p-4 mb-4 border border-slate-200">
            <h2 id="formTitle" class="text-sm font-bold mb-3 text-slate-800">➕ Simpan / Tautkan Barcode Barang</h2>
            <form id="productForm" onsubmit="saveProduct(event)" class="space-y-3 text-xs">
                
                <!-- TOGGLE MODE -->
                <div>
                    <label class="block text-[11px] font-semibold text-slate-600 mb-1">Pilih Tindakan:</label>
                    <div class="flex gap-2">
                        <button type="button" id="modeNewBtn" onclick="setStorageMode('NEW')" class="flex-1 py-2 px-2 rounded-lg font-bold border text-center transition bg-emerald-600 text-white border-emerald-600 shadow-sm">➕ Barang Baru</button>
                        <button type="button" id="modeLinkBtn" onclick="setStorageMode('LINK')" class="flex-1 py-2 px-2 rounded-lg font-bold border text-center transition bg-slate-100 text-slate-700 border-slate-300">🔗 Tautkan ke Barang Lama</button>
                    </div>
                </div>

                <!-- PANEL SEARCH TAUTAN -->
                <div id="linkSearchPanel" class="hidden space-y-2 p-2.5 bg-indigo-50/70 border border-indigo-200 rounded-lg">
                    <label class="block text-[11px] font-bold text-indigo-900">🔍 Cari Nama Barang Lama:</label>
                    <input type="text" id="linkSearchInput" onkeyup="filterLinkSearch()" placeholder="Ketik nama barang (misal: Gas, Indomilk)..." class="w-full p-2 border rounded-lg text-xs bg-white outline-indigo-500 font-semibold">
                    
                    <div id="linkSearchResults" class="max-h-36 overflow-y-auto space-y-1"></div>

                    <div id="selectedLinkBadge" class="hidden p-2 bg-emerald-100 border border-emerald-300 rounded-lg text-emerald-900 font-bold flex justify-between items-center">
                        <span id="selectedLinkText" class="truncate pr-2"></span>
                        <button type="button" onclick="clearSelectedLink()" class="text-xs bg-rose-500 text-white px-2 py-1 rounded font-bold hover:bg-rose-600">✕ Ganti</button>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] text-slate-500 mb-1">Kode Barcode (Otomatis dari scan / ketik):</label>
                    <input type="text" id="barcodeInput" placeholder="Kode Barcode" class="w-full p-2 border rounded font-mono font-semibold bg-slate-50">
                </div>

                <div>
                    <label class="block text-[11px] text-slate-500 mb-1">Nama Barang:</label>
                    <input type="text" id="nameInput" required placeholder="Contoh: Indomie Goreng" class="w-full p-2 border rounded">
                </div>

                <div>
                    <label class="block text-[11px] text-slate-500 mb-1">Harga (4 = 4.000):</label>
                    <input type="text" id="priceInput" required placeholder="Harga" class="w-full p-2 border rounded">
                </div>

                <button id="saveBtn" class="w-full bg-slate-800 text-white p-2.5 rounded-lg font-bold hover:bg-slate-900 transition disabled:bg-slate-400 disabled:cursor-not-allowed">💾 Simpan Barang Baru</button>
                <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="hidden w-full bg-slate-200 text-slate-700 p-2 rounded-lg font-semibold hover:bg-slate-300">Batal Edit</button>
            </form>
        </div>

        <!-- ETALASE BARANG -->
        <div class="bg-white rounded-xl shadow p-4">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold">📦 Etalase Online (Google Sheets)</h2>
                <button id="refreshBtn" onclick="loadProductsFromSheets()" class="text-[10px] bg-slate-200 hover:bg-slate-300 font-semibold px-2 py-1 rounded disabled:opacity-50">🔄 Refresh Data</button>
            </div>
            <input type="text" id="etalaseSearchInput" onkeyup="renderEtalase()" placeholder="🔍 Cari barang / barcode di etalase..." class="w-full mb-3 p-2 border rounded-lg text-xs outline-none focus:ring-1 focus:ring-emerald-500 bg-slate-50">
            <div id="etalaseList" class="space-y-2 max-h-52 overflow-y-auto text-xs"></div>
        </div>
    </div>

    <!-- LOGIKA JAVASCRIPT LENGKAP -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzvtvUu3zaLBfirSb36g5qmkE17uwoOXyUn8qHBom6aRRQ_8hM-4fXl1UshfHYJ8lY1/exec";

        let html5QrCode = null;
        let ocrWorker = null;
        let ocrInterval = null;
        let isProcessingOcr = false;
        let isLockingScan = false;
        let editingId = null;
        let selectedLinkId = 'NEW';
        let isGlobalBusy = false; // Pengunci aksi global

        let products = {};
        let cart = {}; 
        let lastScannedKey = null;
        let lastScanTime = 0;
        let lastFailTime = 0;
        let failTimer = null;

        // --- SINKRONISASI GOOGLE SHEETS ---
        async function loadProductsFromSheets() {
            const liveText = document.getElementById('liveTextDisplay');
            const refreshBtn = document.getElementById('refreshBtn');
            if (liveText) liveText.innerText = "🔄 Mengambil data dari Google Sheets...";
            if (refreshBtn) refreshBtn.disabled = true;

            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                products = data || {};
                
                renderEtalase();
                if (liveText) liveText.innerText = "✅ Etalase Google Sheets siap!";
            } catch (err) {
                console.error("Gagal mengambil data:", err);
                if (liveText) liveText.innerText = "❌ Gagal terhubung ke Google Sheets.";
            } finally {
                if (refreshBtn) refreshBtn.disabled = false;
            }
        }

        async function saveToGoogleSheets(id, name, price, barcodes) {
            const liveText = document.getElementById('liveTextDisplay');
            if (liveText) liveText.innerText = "⏳ Menyimpan ke Google Sheets...";

            const payload = { id, name, price, barcodes };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                if (liveText) liveText.innerText = "✅ Tersimpan di Google Sheets!";
                await loadProductsFromSheets();
            } catch (err) {
                console.error("Gagal menyimpan:", err);
                alert("Gagal menyimpan ke Google Sheets. Periksa koneksi internet.");
            }
        }

        async function deleteFromGoogleSheets(id) {
            const liveText = document.getElementById('liveTextDisplay');
            if (liveText) liveText.innerText = "⏳ Menghapus dari Google Sheets...";

            const payload = { id, action: 'delete' };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                if (liveText) liveText.innerText = "✅ Barang berhasil dihapus!";
                delete products[id];
                renderEtalase();
                await loadProductsFromSheets();
            } catch (err) {
                console.error("Gagal menghapus:", err);
                alert("Gagal menghapus dari Google Sheets. Periksa koneksi internet.");
            }
        }

        async function deleteProduct(id, btnElement) {
            if (isGlobalBusy) return;
            const item = products[id];
            if (!item) return;

            if (confirm(`Apakah Anda yakin ingin menghapus "${item.name}" dari etalase?`)) {
                isGlobalBusy = true;
                if (btnElement) {
                    btnElement.disabled = true;
                    btnElement.innerText = "⏳ Menghapus...";
                    btnElement.classList.add('opacity-50');
                }
                
                await deleteFromGoogleSheets(id);
                isGlobalBusy = false;
            }
        }

        // --- HELPER BANTUAN ---
        function findProductIdByBarcode(barcode) {
            if (!barcode) return null;
            const clean = barcode.trim().toUpperCase();
            for (let id in products) {
                if (products[id].barcodes && products[id].barcodes.includes(clean)) {
                    return id;
                }
            }
            return null;
        }

        function processAmount(val) {
            if (!val) return 0;
            let str = val.toString().replace(',', '.').trim();
            let num = parseFloat(str);
            if (isNaN(num)) return 0;
            if (num > 0 && num < 1000) num = num * 1000;
            return Math.round(num);
        }

        function formatRupiah(num) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
        }

        function cleanAndFixText(text) {
            if (!text) return "";
            return text.toUpperCase()
                .replace(/[\r\n]+/g, ' ')
                .replace(/0/g, 'O')
                .replace(/1/g, 'I')
                .replace(/5/g, 'S')
                .replace(/3/g, 'E')
                .replace(/8/g, 'B')
                .replace(/[^A-Z0-9\s]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function triggerVibration() {
            if ("vibrate" in navigator) navigator.vibrate(200);
        }

        // --- TOGGLE MODE & SEARCH TAUTAN ---
        function setStorageMode(mode) {
            selectedLinkId = mode;
            const newBtn = document.getElementById('modeNewBtn');
            const linkBtn = document.getElementById('modeLinkBtn');
            const searchPanel = document.getElementById('linkSearchPanel');
            const nameInput = document.getElementById('nameInput');
            const priceInput = document.getElementById('priceInput');
            const saveBtn = document.getElementById('saveBtn');

            if (mode === 'NEW') {
                newBtn.className = "flex-1 py-2 px-2 rounded-lg font-bold border text-center transition bg-emerald-600 text-white border-emerald-600 shadow-sm";
                linkBtn.className = "flex-1 py-2 px-2 rounded-lg font-bold border text-center transition bg-slate-100 text-slate-700 border-slate-300";
                searchPanel.classList.add('hidden');
                
                if (!editingId) {
                    nameInput.value = '';
                    priceInput.value = '';
                }
                nameInput.disabled = false;
                priceInput.disabled = false;
                nameInput.classList.remove('bg-slate-100');
                priceInput.classList.remove('bg-slate-100');
                saveBtn.innerText = editingId ? "💾 Simpan Perubahan" : "💾 Simpan Barang Baru";
            } else {
                newBtn.className = "flex-1 py-2 px-2 rounded-lg font-bold border text-center transition bg-slate-100 text-slate-700 border-slate-300";
                linkBtn.className = "flex-1 py-2 px-2 rounded-lg font-bold border text-center transition bg-indigo-600 text-white border-indigo-600 shadow-sm";
                searchPanel.classList.remove('hidden');
                
                document.getElementById('linkSearchInput').value = '';
                document.getElementById('selectedLinkBadge').classList.add('hidden');
                document.getElementById('linkSearchResults').classList.remove('hidden');
                document.getElementById('linkSearchInput').classList.remove('hidden');
                
                filterLinkSearch();
                setTimeout(() => document.getElementById('linkSearchInput').focus(), 100);
            }
        }

        function filterLinkSearch() {
            const rawQuery = document.getElementById('linkSearchInput').value;
            const query = cleanAndFixText(rawQuery);
            const resultsDiv = document.getElementById('linkSearchResults');
            resultsDiv.innerHTML = '';

            let count = 0;
            for (let id in products) {
                const item = products[id];
                const fullText = cleanAndFixText(item.name + " " + (item.barcodes || []).join(" "));

                if (!query || fullText.includes(query)) {
                    count++;
                    const row = document.createElement('div');
                    row.className = "p-2 hover:bg-indigo-100 bg-white border rounded-lg cursor-pointer flex justify-between items-center text-xs transition shadow-sm";
                    row.innerHTML = `
                        <div>
                            <p class="font-bold text-slate-800">${item.name}</p>
                            <p class="text-[10px] text-slate-400 font-mono">${item.barcodes && item.barcodes.length ? item.barcodes.join(', ') : 'Tanpa Barcode'}</p>
                        </div>
                        <span class="font-bold text-indigo-700 bg-indigo-50 px-2 py-1 rounded">${formatRupiah(item.price)}</span>
                    `;
                    row.onclick = () => selectLinkItem(id);
                    resultsDiv.appendChild(row);
                }
            }

            if (count === 0) {
                resultsDiv.innerHTML = `<p class="text-center text-slate-400 p-2 text-xs">Barang tidak ditemukan</p>`;
            }
        }

        function selectLinkItem(id) {
            selectedLinkId = id;
            const item = products[id];
            
            document.getElementById('linkSearchResults').classList.add('hidden');
            document.getElementById('linkSearchInput').classList.add('hidden');
            
            const badge = document.getElementById('selectedLinkBadge');
            badge.classList.remove('hidden');
            document.getElementById('selectedLinkText').innerText = `🔗 ${item.name} (${formatRupiah(item.price)})`;

            const nameInput = document.getElementById('nameInput');
            const priceInput = document.getElementById('priceInput');
            nameInput.value = item.name;
            priceInput.value = item.price;
            nameInput.disabled = true;
            priceInput.disabled = true;
            nameInput.classList.add('bg-slate-100');
            priceInput.classList.add('bg-slate-100');

            document.getElementById('saveBtn').innerText = `🔗 Tautkan Barcode ke "${item.name}"`;
        }

        function clearSelectedLink() {
            selectedLinkId = 'LINK';
            document.getElementById('selectedLinkBadge').classList.add('hidden');
            document.getElementById('linkSearchResults').classList.remove('hidden');
            document.getElementById('linkSearchInput').classList.remove('hidden');
            document.getElementById('linkSearchInput').value = '';
            filterLinkSearch();

            const nameInput = document.getElementById('nameInput');
            const priceInput = document.getElementById('priceInput');
            nameInput.value = '';
            priceInput.value = '';
            nameInput.disabled = false;
            priceInput.disabled = false;
            nameInput.classList.remove('bg-slate-100');
            priceInput.classList.remove('bg-slate-100');
            document.getElementById('saveBtn').innerText = "💾 Pilih Barang di Atas";
        }

        // --- MANAJEMEN KERANJANG ---
        function getGrandTotal() {
            return Object.keys(cart).reduce((sum, id) => sum + (cart[id].price * cart[id].qty), 0);
        }

        function calculateChange() {
            const total = getGrandTotal();
            const paidRaw = document.getElementById('paidInput').value;
            const paid = processAmount(paidRaw);
            const changeOutput = document.getElementById('changeOutput');

            if (paid === 0 || paidRaw === "") {
                changeOutput.className = "font-bold text-slate-800";
                changeOutput.innerText = "Rp 0";
                return;
            }

            const change = paid - total;
            if (change >= 0) {
                changeOutput.className = "font-bold text-emerald-600";
                changeOutput.innerText = formatRupiah(change);
            } else {
                changeOutput.className = "font-bold text-rose-600";
                changeOutput.innerText = "Kurang " + formatRupiah(Math.abs(change));
            }
        }

        function setPaidAmount(val) {
            const total = getGrandTotal();
            if (val === 'exact') {
                document.getElementById('paidInput').value = total;
            } else {
                document.getElementById('paidInput').value = val;
            }
            calculateChange();
        }

        function showScanFeedback(isSuccess, text) {
            if (isSuccess) {
                const overlay = document.getElementById('successOverlay');
                document.getElementById('successText').innerText = text;

                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0', 'scale-90'), 10);

                setTimeout(() => {
                    overlay.classList.add('opacity-0', 'scale-90');
                    setTimeout(() => overlay.classList.add('hidden'), 200);
                }, 800);

                document.getElementById('failIndicator').classList.add('hidden');
            } else {
                const failIndicator = document.getElementById('failIndicator');
                failIndicator.classList.remove('hidden');

                if (failTimer) clearTimeout(failTimer);
                failTimer = setTimeout(() => {
                    failIndicator.classList.add('hidden');
                }, 1800);
            }
        }

        function filterManualSearch() {
            const rawQuery = document.getElementById('manualSearchInput').value;
            const query = cleanAndFixText(rawQuery);
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '';

            if (query.length === 0) {
                resultsDiv.classList.add('hidden');
                return;
            }

            let matches = 0;
            for (let id in products) {
                const item = products[id];
                const barcodeStr = (item.barcodes || []).join(" ");
                const fullText = cleanAndFixText(item.name + " " + barcodeStr);

                if (fullText.includes(query) || query.split(/\s+/).some(q => q.length >= 3 && fullText.includes(q))) {
                    matches++;
                    const row = document.createElement('div');
                    row.className = "p-2.5 hover:bg-emerald-50 cursor-pointer border-b last:border-b-0 flex justify-between items-center text-xs transition";
                    row.innerHTML = `
                        <div>
                            <p class="font-bold text-slate-800">${item.name}</p>
                            <p class="text-[10px] text-slate-400">Barcode: ${item.barcodes && item.barcodes.length ? item.barcodes.join(', ') : 'Tanpa Barcode'}</p>
                        </div>
                        <span class="font-bold text-emerald-700">${formatRupiah(item.price)}</span>
                    `;
                    row.onclick = () => {
                        addToCart(id);
                        showScanFeedback(true, item.name);
                        triggerVibration();
                        document.getElementById('manualSearchInput').value = '';
                        resultsDiv.classList.add('hidden');
                    };
                    resultsDiv.appendChild(row);
                }
            }

            if (matches > 0) {
                resultsDiv.classList.remove('hidden');
            } else {
                resultsDiv.innerHTML = `<div class="p-3 text-center text-slate-400 text-xs">Barang tidak ditemukan</div>`;
                resultsDiv.classList.remove('hidden');
            }
        }

        // --- FITUR SUARA (MIC) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'id-ID';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('micBtn').className = "bg-rose-600 text-white p-2 rounded-lg text-base animate-pulse transition shrink-0";
                document.getElementById('liveTextDisplay').innerText = "🎙️ Mendengarkan suara...";
            };

            recognition.onresult = (event) => {
                const spokenText = event.results[0][0].transcript;
                document.getElementById('liveTextDisplay').innerText = `Suara: "${spokenText}"`;
                matchAndAddToCart(spokenText, true);
            };

            recognition.onerror = () => {
                document.getElementById('liveTextDisplay').innerText = "⚠️ Suara tidak terdeteksi.";
                showScanFeedback(false, "Suara Tidak Terdeteksi");
            };

            recognition.onend = () => {
                isListening = false;
                document.getElementById('micBtn').className = "bg-indigo-600 text-white p-2 rounded-lg text-base hover:bg-indigo-700 transition shrink-0";
            };
        }

        function toggleVoice() {
            if (!SpeechRecognition) {
                alert("Browser HP Anda belum mendukung input suara.");
                return;
            }
            if (isListening) recognition.stop();
            else recognition.start();
        }

        function matchAndAddToCart(inputText, isExplicitAction = false) {
            const cleanInput = cleanAndFixText(inputText);
            if (cleanInput.length < 2) return;

            let matchedIds = [];

            for (let id in products) {
                const item = products[id];
                const barcodeStr = (item.barcodes || []).join(" ");
                const fullTargetText = cleanAndFixText(item.name + " " + barcodeStr);
                const inputWords = cleanInput.split(/\s+/).filter(w => w.length >= 3);
                const targetWords = fullTargetText.split(/\s+/).filter(w => w.length >= 3);

                let isMatch = false;
                if (cleanInput.includes(fullTargetText) || fullTargetText.includes(cleanInput)) {
                    isMatch = true;
                } else {
                    for (let inW of inputWords) {
                        for (let tarW of targetWords) {
                            if (tarW.includes(inW) || inW.includes(tarW)) {
                                isMatch = true;
                                break;
                            }
                        }
                        if (isMatch) break;
                    }
                }

                if (isMatch) matchedIds.push(id);
            }

            if (matchedIds.length === 1) {
                const matchedId = matchedIds[0];
                showScanFeedback(true, products[matchedId].name);
                triggerVibration();
                addToCart(matchedId);
            } else if (matchedIds.length > 1) {
                document.getElementById('manualSearchInput').value = inputText.trim();
                filterManualSearch();
                document.getElementById('liveTextDisplay').innerText = `⚠️ Pilih varian untuk "${inputText}" di bawah`;
                triggerVibration();
            } else if (isExplicitAction) {
                showScanFeedback(false, `Tidak Ditemukan`);
            } else {
                const now = Date.now();
                if (now - lastFailTime > 2500) {
                    lastFailTime = now;
                    showScanFeedback(false, "Tidak Ditemukan");
                }
            }
        }

        // --- KAMERA SCANNER ---
        async function startScanner() {
            if (html5QrCode && html5QrCode.isScanning) return;
            document.getElementById('liveTextDisplay').innerText = "Menyiapkan kamera...";

            if (!ocrWorker) {
                try { ocrWorker = await Tesseract.createWorker('ind'); } catch(e) {}
            }

            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: { width: 220, height: 140 } },
                (barcode) => handleDetectedKey(barcode),
                () => {}
            ).then(() => {
                document.getElementById('liveTextDisplay').innerText = "Kamera aktif, arahkan ke barang...";
                ocrInterval = setInterval(processLiveFrameOCR, 1500);
            }).catch(err => {
                document.getElementById('liveTextDisplay').innerText = "Gagal membuka kamera.";
            });
        }

        function stopScanner() {
            if (ocrInterval) clearInterval(ocrInterval);
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById("reader").innerHTML = "";
                    document.getElementById('liveTextDisplay').innerText = "Kamera mati.";
                    document.getElementById('failIndicator').classList.add('hidden');
                });
            }
        }

        async function processLiveFrameOCR() {
            if (isProcessingOcr || !ocrWorker) return;
            const videoElement = document.querySelector("#reader video");
            if (!videoElement || videoElement.readyState !== 4) return;

            isProcessingOcr = true;
            try {
                const canvas = document.createElement("canvas");
                canvas.width = videoElement.videoWidth / 2;
                canvas.height = videoElement.videoHeight / 2;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

                const result = await ocrWorker.recognize(canvas);
                const cleanOcr = cleanAndFixText(result.data.text);

                if (cleanOcr.length > 0) {
                    document.getElementById('liveTextDisplay').innerText = cleanOcr.substring(0, 30);
                    matchAndAddToCart(cleanOcr, false);
                }
            } catch (e) {
                console.error("OCR Error:", e);
            } finally {
                isProcessingOcr = false;
            }
        }

        function handleDetectedKey(key) {
            if (isLockingScan) return;

            const now = Date.now();
            if (key === lastScannedKey && (now - lastScanTime) < 2000) return;

            lastScannedKey = key;
            lastScanTime = now;

            const matchedId = findProductIdByBarcode(key);

            if (matchedId) {
                isLockingScan = true;
                showScanFeedback(true, products[matchedId].name);
                triggerVibration();
                addToCart(matchedId);
                setTimeout(() => { isLockingScan = false; }, 2000);
            } else {
                document.getElementById('barcodeInput').value = key;
                showScanFeedback(false, "Barcode Baru! Pilih Buat / Tautkan");
                triggerVibration();

                setStorageMode('LINK');
                document.getElementById('productForm').scrollIntoView({ behavior: 'smooth' });
            }
        }

        function addToCart(productId) {
            if (!products[productId]) return;
            if (cart[productId]) {
                cart[productId].qty += 1;
            } else {
                cart[productId] = { name: products[productId].name, price: products[productId].price, qty: 1 };
            }
            renderCart();
        }

        function updateQty(productId, change) {
            if (cart[productId]) {
                cart[productId].qty += change;
                if (cart[productId].qty <= 0) delete cart[productId];
                renderCart();
            }
        }

        function removeFromCart(productId) {
            delete cart[productId];
            renderCart();
        }

        function clearCart() {
            cart = {};
            document.getElementById('paidInput').value = '';
            renderCart();
        }

        function renderCart() {
            const cartList = document.getElementById('cartList');
            const ids = Object.keys(cart);
            cartList.innerHTML = '';

            if (ids.length === 0) {
                cartList.innerHTML = `<p class="text-center text-slate-400 py-3">Scan camera, sebut nama (mic), atau ketik manual.</p>`;
            } else {
                ids.forEach(id => {
                    const item = cart[id];
                    const subtotal = item.price * item.qty;
                    cartList.innerHTML += `
                        <div class="flex justify-between items-center p-2 bg-slate-50 rounded border">
                            <div class="flex-1 pr-2">
                                <p class="font-bold text-slate-800">${item.name}</p>
                                <p class="text-[11px] text-slate-500">${formatRupiah(item.price)} x ${item.qty} = <span class="font-semibold text-emerald-700">${formatRupiah(subtotal)}</span></p>
                            </div>
                            <div class="flex items-center gap-1 shrink-0">
                                <button onclick="updateQty('${id}', -1)" class="w-6 h-6 bg-slate-200 text-slate-700 font-bold rounded text-xs hover:bg-slate-300">-</button>
                                <span class="w-6 text-center font-bold text-xs">${item.qty}</span>
                                <button onclick="updateQty('${id}', 1)" class="w-6 h-6 bg-slate-200 text-slate-700 font-bold rounded text-xs hover:bg-slate-300">+</button>
                                <button onclick="removeFromCart('${id}')" title="Hapus" class="ml-1 text-rose-500 hover:text-rose-700 font-bold text-xs p-1">❌</button>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('grandTotal').innerText = formatRupiah(getGrandTotal());
            calculateChange();
        }

        // --- SIMPAN DAN PENAUTAN BARANG KE GOOGLE SHEETS ---
        async function saveProduct(e) {
            e.preventDefault();
            if (isGlobalBusy) return;

            const saveBtn = document.getElementById('saveBtn');
            const originalText = saveBtn.innerText;
            const barcode = document.getElementById('barcodeInput').value.trim().toUpperCase();

            // MATIKAN TOMBOL SIMPAN SEMENTARA
            isGlobalBusy = true;
            saveBtn.disabled = true;
            saveBtn.innerText = "⏳ Memproses ke Google Sheets...";

            try {
                // OPSI A: TAUTKAN BARCODE KE BARANG LAMA
                if (selectedLinkId !== 'NEW' && selectedLinkId !== 'LINK') {
                    if (!barcode) {
                        alert("Isi atau scan barcode terlebih dahulu sebelum menautkan!");
                        return;
                    }
                    const targetProd = products[selectedLinkId];

                    if (!targetProd.barcodes.includes(barcode)) {
                        targetProd.barcodes.push(barcode);
                        await saveToGoogleSheets(selectedLinkId, targetProd.name, targetProd.price, targetProd.barcodes);
                    } else {
                        alert(`Barcode "${barcode}" sudah ada di ${targetProd.name}.`);
                    }

                    cancelEdit();
                    return;
                }

                if (selectedLinkId === 'LINK') {
                    alert("Mohon ketik & klik nama barang lama yang mau ditautkan!");
                    return;
                }

                // OPSI B: BARANG BARU ATAU EDIT DETAIL
                const name = document.getElementById('nameInput').value.trim();
                const rawPrice = document.getElementById('priceInput').value;
                const price = processAmount(rawPrice);

                if (!name || price === 0) {
                    alert("Mohon isi nama dan harga barang dengan benar.");
                    return;
                }

                let targetId = editingId;
                let bList = [];

                if (editingId) {
                    products[editingId].name = name;
                    products[editingId].price = price;
                    if (barcode && !products[editingId].barcodes.includes(barcode)) {
                        products[editingId].barcodes.push(barcode);
                    }
                    bList = products[editingId].barcodes;
                } else {
                    targetId = "PROD_" + Date.now();
                    bList = barcode ? [barcode] : [];
                }

                await saveToGoogleSheets(targetId, name, price, bList);
                cancelEdit();
            } finally {
                // HIDUPKAN KEMBALI TOMBOL
                isGlobalBusy = false;
                saveBtn.disabled = false;
                saveBtn.innerText = originalText;
            }
        }

        function editProduct(id) {
            editingId = id;
            const item = products[id];

            setStorageMode('NEW');

            document.getElementById('barcodeInput').value = (item.barcodes && item.barcodes.length) ? item.barcodes[0] : '';
            document.getElementById('nameInput').value = item.name;
            document.getElementById('priceInput').value = item.price;

            document.getElementById('formTitle').innerText = "✏️ Edit Detail Barang Etalase";
            document.getElementById('saveBtn').innerText = "💾 Simpan Perubahan";
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            document.getElementById('productForm').scrollIntoView({ behavior: 'smooth' });
        }

        async function removeBarcodeFromProduct(id, barcode) {
            if (isGlobalBusy) return;
            if (confirm(`Hapus barcode "${barcode}" dari "${products[id].name}"?`)) {
                isGlobalBusy = true;
                products[id].barcodes = products[id].barcodes.filter(b => b !== barcode);
                await saveToGoogleSheets(id, products[id].name, products[id].price, products[id].barcodes);
                isGlobalBusy = false;
            }
        }

        function cancelEdit() {
            editingId = null;
            document.getElementById('productForm').reset();
            setStorageMode('NEW');
            document.getElementById('formTitle').innerText = "➕ Simpan / Tautkan Barcode Barang";
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        function renderEtalase() {
            const listDiv = document.getElementById('etalaseList');
            const searchInput = document.getElementById('etalaseSearchInput');
            const searchQuery = searchInput ? cleanAndFixText(searchInput.value) : "";
            const ids = Object.keys(products);

            listDiv.innerHTML = '';

            if (ids.length === 0) {
                listDiv.innerHTML = `<p class="text-center text-slate-400 py-3">Belum ada barang di etalase Google Sheets.</p>`;
                return;
            }

            const filteredIds = ids.filter(id => {
                const item = products[id];
                const bStr = (item.barcodes || []).join(" ");
                const fullText = cleanAndFixText(item.name + " " + bStr);
                return fullText.includes(searchQuery);
            });

            if (filteredIds.length === 0) {
                listDiv.innerHTML = `<p class="text-center text-slate-400 py-3">Barang tidak ditemukan di etalase.</p>`;
                return;
            }

            filteredIds.forEach(id => {
                const item = products[id];
                let barcodeBadges = '';

                if (item.barcodes && item.barcodes.length > 0) {
                    barcodeBadges = item.barcodes.map(b => `
                        <span class="inline-flex items-center gap-1 bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded text-[10px] font-mono mt-1">
                            ${b} <button onclick="removeBarcodeFromProduct('${id}', '${b}')" class="text-rose-600 font-bold hover:text-rose-800" title="Hapus Barcode Ini">×</button>
                        </span>
                    `).join(" ");
                } else {
                    barcodeBadges = `<span class="text-[10px] text-slate-400 italic">Tanpa Barcode</span>`;
                }

                listDiv.innerHTML += `
                    <div class="p-2.5 bg-slate-50 border rounded-lg space-y-1.5">
                        <div class="flex justify-between items-start">
                            <div class="overflow-hidden mr-2">
                                <p class="font-bold text-slate-800 truncate text-xs">${item.name}</p>
                                <p class="font-bold text-emerald-700 text-xs">${formatRupiah(item.price)}</p>
                            </div>
                            <div class="flex gap-1 shrink-0">
                                <button onclick="editProduct('${id}')" class="px-2 py-1 bg-amber-100 text-amber-800 rounded font-semibold text-[10px] hover:bg-amber-200">✏️ Edit</button>
                                <button onclick="deleteProduct('${id}', this)" class="px-2 py-1 bg-rose-100 text-rose-700 rounded font-semibold text-[10px] hover:bg-rose-200">🗑️ Hapus</button>
                            </div>
                        </div>
                        <div class="pt-1 border-t border-slate-200 flex flex-wrap gap-1 items-center">
                            <span class="text-[10px] font-semibold text-slate-500">Barcode (${item.barcodes ? item.barcodes.length : 0}):</span>
                            ${barcodeBadges}
                        </div>
                    </div>
                `;
            });
        }

        renderCart();
        loadProductsFromSheets();
    </script>
</body>
</html>
